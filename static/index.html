<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>voice-slides — presenter</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <h1>voice-slides</h1>
  <p class="sub">Talk. It builds the deck.</p>
  <div id="nav" title="Which slide the popout is showing">
    <button id="prev" aria-label="Previous slide">&lsaquo;</button>
    <span class="pos" id="pos">– / –</span>
    <button id="next" aria-label="Next slide">&rsaquo;</button>
  </div>
  <select id="modality" title="How much licence the formatting pass has"></select>
  <div class="menu" id="thememenu">
    <button id="themebtn" title="Deck palette">Theme</button>
    <div class="panel"><h4>Palette</h4><div id="palettes"></div></div>
  </div>
  <div class="menu" id="featmenu">
    <button id="featbtn" title="Which parts of the vocabulary the agent may use">Features</button>
    <div class="panel"><h4>Enabled</h4><div id="features"></div></div>
  </div>
  <span id="status">connecting…</span>
  <button id="rec">Start dictating</button>
  <button id="flush" title="Run the formatting pass now">Format</button>
  <button id="popout" title="Open the presentation window">Present ↗</button>
  <button id="export" title="Download the deck as slides.md">Export</button>
  <button id="slidev">Slidev</button>
  <button id="reset" title="Throw away the deck and start again">New</button>
  <button id="theme" title="Light / dark / follow the system" aria-label="Light or dark">◐</button>
</header>
<main class="presenter">
  <section id="left">
    <div class="pane-title">You said</div>
    <div id="transcript"><div id="partial"></div></div>
  </section>
  <section id="agentpane">
    <div class="pane-title">Agent</div>
    <div id="agent"></div>
  </section>
  <section id="deckpane">
    <div class="pane-title">Deck<div id="tools"></div></div>
    <div id="deck"><div class="empty">Nothing yet \u2014 press <b>Start dictating</b> and say what the talk is about.</div></div>
  </section>
</main>
<script type="module">
"use strict";

// ---------------------------------------------------------------------------
// voice-slides — PRESENTER view.
//
// The main page is the desk you work from, not the thing the audience sees:
// what you actually said, what the agent did with it, the controls, and a
// preview of every slide. The audience gets `present.html` in a second window,
// which draws one slide full-bleed and nothing else.
//
// The two windows share state over a BroadcastChannel rather than over the
// server. That is not an optimisation — the popout has no WebSocket, no STT,
// and no inference, so a projector on a laptop with the network unplugged keeps
// presenting. The presenter owns the state; the popout is a view of it.
// ---------------------------------------------------------------------------

import * as R from './render.js';

const $ = id => document.getElementById(id);
const statusEl = $('status'), partialEl = $('partial'),
      transcriptEl = $('transcript'), deckEl = $('deck'), agentEl = $('agent');

let ws = null, wsReady = false;
let ctx = null, node = null, src = null, stream = null, deckPath = '';
let recording = false, deck = '', slides = [], current = 0, follow = true;
let palette = localStorage.getItem('vs-palette') || 'default';
let featureSet = new Set();
const EMPTY_HTML = '<div class="empty">Nothing yet — press <b>Start dictating</b> and say what the talk is about.</div>';

// ---------------------------------------------------------------------------
// § The deck preview
//
// Every slide, as a card, with the presented one marked. `follow` is what makes
// it track the dictation head: the speaker's attention is at the end of the
// deck while they are talking, and anywhere they clicked once they are not.
// ---------------------------------------------------------------------------

function renderDeck() {
  slides = R.slides(deck);
  if (!slides.length) { deckEl.innerHTML = EMPTY_HTML; $('pos').textContent = '– / –'; return; }
  if (follow) current = slides.length - 1;
  current = Math.max(0, Math.min(current, slides.length - 1));
  deckEl.innerHTML = '';
  slides.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'slide' + (i === current ? ' active' : '') + (s.centered ? ' mid' : '');
    el.innerHTML =
      `<div class="badge">${R.escapeHtml(s.layout)}</div>` +
      `<div class="content">${s.html}</div>` +
      (s.note ? `<div class="note">${s.note}</div>` : '') +
      `<div class="num">${i + 1} / ${slides.length}</div>`;
    el.addEventListener('click', () => goto(i, { user: true }));
    deckEl.appendChild(el);
  });
  deckEl.children[current].scrollIntoView({ behavior: 'smooth', block: 'center' });
  $('pos').textContent = `${current + 1} / ${slides.length}`;
  R.hydrateMermaid(deckEl);
  publish();
}

// -- § navigation -----------------------------------------------------------
// One entry point, whether the move came from a click, an arrow key, the popout
// window, or an `@vs goto` the agent emitted. Landing on the last slide turns
// `follow` back on, because "show the end" and "keep up with me" are the same
// intent while dictation is still running.

function goto(i, { user = false, quiet = false } = {}) {
  const n = slides.length;
  if (!n) return;
  current = Math.max(0, Math.min(i, n - 1));
  follow = user ? current === n - 1 : follow;
  for (let k = 0; k < deckEl.children.length; k++)
    deckEl.children[k].classList.toggle('active', k === current);
  if (deckEl.children[current]) deckEl.children[current].scrollIntoView({ behavior: 'smooth', block: 'center' });
  $('pos').textContent = `${current + 1} / ${n}`;
  if (!quiet) publish();
}

function nav(action, index) {
  if (action === 'goto' && index) return goto(index - 1);
  if (action === 'next') return goto(current + 1);
  if (action === 'prev') return goto(current - 1);
  if (action === 'first') return goto(0);
  if (action === 'last') { follow = true; return goto(slides.length - 1); }
}

// ---------------------------------------------------------------------------
// § The popout
//
// `window.open` plus a BroadcastChannel. The channel is same-origin and needs
// no handshake, so the popout announces itself and the presenter answers with
// the whole state — which also makes reopening it after a close free.
// ---------------------------------------------------------------------------

const chan = ('BroadcastChannel' in window) ? new BroadcastChannel('voice-slides') : null;
let stage = null;

function publish() {
  if (!chan) return;
  chan.postMessage({ k: 'state', md: deck, i: current, palette,
                     mode: localStorage.getItem('vs-theme') || 'auto',
                     features: [...featureSet] });
}

if (chan) chan.onmessage = e => {
  const m = e.data || {};
  if (m.k === 'hello') publish();
  else if (m.k === 'index') goto(m.i, { quiet: true });   // the popout moved itself
};

$('popout').addEventListener('click', () => {
  stage = window.open('present.html', 'voice-slides-stage',
                      'width=1280,height=740,menubar=no,toolbar=no');
  if (!stage) { setStatus('popup blocked', 'err'); return; }
  setTimeout(publish, 400);        // in case it misses its own hello
});

// ---------------------------------------------------------------------------
// § Transport
// ---------------------------------------------------------------------------

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { wsReady = true; setStatus('ready'); ws.send(JSON.stringify({ type: 'hello' })); };
  ws.onclose = () => { wsReady = false; setStatus('reconnecting…', 'err'); setTimeout(connect, 1500); };
  ws.onmessage = e => onMessage(JSON.parse(e.data));
}

function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = cls || ''; }

// The status line carries the shape of the background work, not just its
// presence: a pass running with two sentences already queued behind it is a
// different thing to look at than a pass running on the last of the speech.
function setWork(m) {
  const bits = [];
  if (m.busy) bits.push('formatting');
  if (m.queued) bits.push(m.queued + 'w queued');
  if (m.tools) bits.push(m.tools + ' lookup' + (m.tools > 1 ? 's' : ''));
  if (!bits.length) return setStatus(m.text || (recording ? 'listening…' : 'ready'),
                                     recording ? 'live' : '');
  statusEl.className = 'live';
  statusEl.innerHTML = '<span class="work">' + R.escapeHtml(bits.join(' · ')) + '</span>';
}

function onMessage(m) {
  if (m.type === 'partial') { partialEl.textContent = m.text ? '… ' + m.text : ''; scrollTranscript(); }
  else if (m.type === 'final') {
    partialEl.textContent = '';
    const p = document.createElement('p');
    p.textContent = m.text;
    transcriptEl.insertBefore(p, partialEl);
    scrollTranscript();
  }
  else if (m.type === 'deck') {
    deck = m.markdown || '';
    renderDeck();
    if (m.pass_ms) setStatus(`deck updated ${(m.pass_ms / 1000).toFixed(1)}s` +
                             (m.settled ? '' : ' (mid-sentence)'));
  }
  else if (m.type === 'status') { setWork(m); }
  else if (m.type === 'error') { setStatus(m.message, 'err'); }
  else if (m.type === 'tool') { showTool(m); }
  else if (m.type === 'agent') { showAgent(m); }
  else if (m.type === 'nav') { nav(m.action, m.index); }
  else if (m.type === 'theme') { applyPalette(m.theme); }
  else if (m.type === 'features') { applyFeatures(m.features); }
  else if (m.type === 'config') {
    deckPath = m.deck_path;
    $('slidev').title = 'npx slidev ' + deckPath;
    fillModalities(m.modalities || [], m.modality);
    fillPalettes(m.themes || []);
    fillFeatures(m.feature_list || [], m.features || []);
    applyPalette(localStorage.getItem('vs-palette') || m.theme, { push: true });
  }
}

// ---------------------------------------------------------------------------
// § The agent conversation
//
// The other half of the transcript. The left pane is what the room heard; this
// is what the agent was handed and what it did with it — which is the pane you
// look at when the deck says something you did not say.
// ---------------------------------------------------------------------------

const WHO = { dictation: 'sent', deck: 'deck', tool: 'lookup', directive: 'did',
              config: 'set', error: 'error' };

function showAgent(m) {
  if (m.role === 'tool' && m.state === 'running') return;   // the chip covers it
  const row = document.createElement('div');
  // `open` marks a pass that fired at a phrase break rather than a full stop:
  // the agent was told the speaker had not finished, and the ellipsis is that.
  row.className = 'turn ' + m.role + (m.settled === false ? ' open' : '');
  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = WHO[m.role] || m.role;
  const what = document.createElement('div');
  what.className = 'what';
  what.textContent = m.text + (m.ms ? `  ·  ${(m.ms / 1000).toFixed(1)}s` : '');
  row.append(who, what);
  agentEl.appendChild(row);
  agentEl.scrollTop = agentEl.scrollHeight;
}

// ---------------------------------------------------------------------------
// § Theme and features
//
// Both are server-owned: the palette ids and the feature list arrive in the
// config frame, because the model is told about them in its prompt and a
// control that offers something the prompt does not mention is a control that
// does nothing. A palette can be set from three places — this picker, a spoken
// request the agent turned into `@vs theme …`, and localStorage on load — so
// `applyPalette` is the only thing that writes it.
// ---------------------------------------------------------------------------

function fillPalettes(list) {
  const box = $('palettes');
  if (!list.length || box.children.length) return;
  for (const t of list) {
    const lab = document.createElement('label');
    lab.innerHTML = `<span class="swatch" data-p="${R.escapeHtml(t.id)}"></span>` +
                    `<span>${R.escapeHtml(t.label)}<br><small>${R.escapeHtml(t.blurb)}</small></span>`;
    // The swatch is drawn by the palette itself: a hidden element carrying the
    // palette attribute picks up that palette's accent, so the colour in the
    // menu cannot disagree with the colour the deck turns.
    const sw = lab.firstChild;
    sw.style.background = getComputedStyle(document.documentElement)
      .getPropertyValue('--accent') || 'currentColor';
    sw.dataset.swatch = t.id;
    lab.addEventListener('click', () => { applyPalette(t.id, { push: true }); $('thememenu').classList.remove('open'); });
    box.appendChild(lab);
  }
  paintSwatches();
}

// Read each palette's accent out of the stylesheet by briefly wearing it. Cheap
// (once, on load) and it means adding a palette to app.css is the whole change.
function paintSwatches() {
  const root = document.documentElement, was = root.getAttribute('data-palette');
  for (const sw of document.querySelectorAll('[data-swatch]')) {
    root.setAttribute('data-palette', sw.dataset.swatch);
    sw.style.background = getComputedStyle(root).getPropertyValue('--accent').trim();
  }
  if (was) root.setAttribute('data-palette', was); else root.removeAttribute('data-palette');
}

function applyPalette(id, { push = false } = {}) {
  if (!id) return;
  palette = id;
  document.documentElement.setAttribute('data-palette', id);
  localStorage.setItem('vs-palette', id);
  for (const lab of $('palettes').querySelectorAll('label'))
    lab.style.fontWeight = lab.querySelector('[data-swatch]').dataset.swatch === id ? '600' : '';
  if (push && wsReady) ws.send(JSON.stringify({ type: 'theme', id }));
  publish();
}

function fillFeatures(list, on) {
  const box = $('features');
  if (!list.length || box.children.length) return;
  for (const f of list) {
    const lab = document.createElement('label');
    lab.innerHTML = `<input type="checkbox" data-feat="${R.escapeHtml(f.id)}">` +
                    `<span>${R.escapeHtml(f.label)}<br><small>${R.escapeHtml(f.hint)}</small></span>`;
    lab.querySelector('input').addEventListener('change', e => {
      ws.send(JSON.stringify({ type: 'feature', id: f.id, on: e.target.checked }));
    });
    box.appendChild(lab);
  }
  applyFeatures(on);
}

function applyFeatures(list) {
  featureSet = new Set(list || []);
  R.setFeatures(featureSet);
  for (const cb of document.querySelectorAll('[data-feat]'))
    cb.checked = featureSet.has(cb.dataset.feat);
  if (deck) renderDeck(); else publish();
}

for (const [btn, menu] of [['themebtn', 'thememenu'], ['featbtn', 'featmenu']])
  $(btn).addEventListener('click', e => {
    e.stopPropagation();
    const open = $(menu).classList.contains('open');
    document.querySelectorAll('.menu').forEach(m => m.classList.remove('open'));
    if (!open) $(menu).classList.add('open');
  });
document.addEventListener('click', () =>
  document.querySelectorAll('.menu').forEach(m => m.classList.remove('open')));

// ---------------------------------------------------------------------------
// § Modality
// ---------------------------------------------------------------------------

function fillModalities(list, current) {
  const sel = $('modality');
  if (!list.length || sel.options.length === list.length) return;
  sel.innerHTML = '';
  for (const m of list) {
    const o = document.createElement('option');
    o.value = m.id;
    o.textContent = m.label;
    o.title = m.hint;
    sel.appendChild(o);
  }
  sel.value = localStorage.getItem('vs-modality') || current || list[0].id;
  sendModality();
}

function sendModality() {
  const id = $('modality').value;
  if (!id) return;
  localStorage.setItem('vs-modality', id);
  const opt = $('modality').selectedOptions[0];
  $('modality').title = (opt && opt.title) || '';
  if (wsReady) ws.send(JSON.stringify({ type: 'modality', id }));
}

// A pass in the highlights modality can spend ten seconds inside a fetch. The
// chip is what makes that legible instead of a hang.
const chips = new Map();

function showTool(m) {
  const key = m.name + '|' + m.detail;
  let chip = chips.get(key);
  if (!chip) {
    chip = document.createElement('span');
    chip.className = 'chip';
    chip.innerHTML = '<i class="spin"></i><span></span>';
    $('tools').appendChild(chip);
    chips.set(key, chip);
  }
  const label = chip.lastChild;
  if (m.state === 'running') { label.textContent = m.detail || m.name; return; }
  chip.className = 'chip ' + m.state;
  chip.firstChild.textContent = m.state === 'done' ? '✓' : '✗';
  label.textContent = (m.detail || m.name) + (m.note ? ' — ' + m.note : '');
  setTimeout(() => { chip.classList.add('fade'); }, m.state === 'done' ? 2500 : 6000);
  setTimeout(() => { chip.remove(); chips.delete(key); }, m.state === 'done' ? 3000 : 6500);
}

function scrollTranscript() { transcriptEl.scrollTop = transcriptEl.scrollHeight; }

// ---------------------------------------------------------------------------
// § Capture. Continuous dictation with energy-based endpointing: /stt/stream is
// turn-based (one authoritative final per {"type":"end"}), so something has to
// decide where an utterance ends. A short RMS gate does it without a model, a
// worklet file, or a VAD dependency.
// ---------------------------------------------------------------------------

const FRAME = 1024;              // ~64 ms at 16 kHz
const SILENCE_RMS = 0.012;       // below this counts as silence
const SILENCE_MS = 900;          // ...for this long, and the utterance ends
const MAX_TURN_MS = 25000;       // ...or this long regardless, so the deck moves

let voiced = false, lastVoice = 0, turnStart = 0;

async function startRec() {
  if (recording || !wsReady) return;
  if (!ctx) {
    // Ask for 16 kHz directly; the browser resamples, so no manual decimation.
    ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
    src = ctx.createMediaStreamSource(stream);
    node = ctx.createScriptProcessor(FRAME, 1, 1);
    node.onaudioprocess = onAudio;
    src.connect(node);
    node.connect(ctx.destination);
  }
  await ctx.resume();
  recording = true; voiced = false; turnStart = 0;
  $('rec').classList.add('on');
  $('rec').textContent = 'Stop';
  setStatus('listening…', 'live');
}

function onAudio(e) {
  if (!recording || !wsReady) return;
  const f = e.inputBuffer.getChannelData(0);
  let sum = 0;
  const pcm = new Int16Array(f.length);
  for (let i = 0; i < f.length; i++) {
    const s = Math.max(-1, Math.min(1, f[i]));
    sum += s * s;
    pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  const rms = Math.sqrt(sum / f.length);
  const now = performance.now();

  if (rms >= SILENCE_RMS) {
    if (!voiced) { voiced = true; turnStart = now; }
    lastVoice = now;
  }
  // Leading silence is not worth uploading; trailing silence is — it is what
  // gives the decoder its right-context on the last word.
  if (voiced) ws.send(pcm.buffer);

  if (voiced && (now - lastVoice > SILENCE_MS || now - turnStart > MAX_TURN_MS)) {
    ws.send(JSON.stringify({ type: 'end' }));
    voiced = false;
  }
}

function stopRec() {
  if (!recording) return;
  recording = false;
  if (voiced) { ws.send(JSON.stringify({ type: 'end' })); voiced = false; }
  $('rec').classList.remove('on');
  $('rec').textContent = 'Start dictating';
  setStatus('stopped');
}


// ---------------------------------------------------------------------------
// § Controls
// ---------------------------------------------------------------------------

// Light / dark / follow the system, orthogonal to the palette. `data-theme`
// overrides the media query; absent, the media query wins.
const MODES = ['auto', 'light', 'dark'], GLYPH = { auto: '\u25d0', light: '\u2600', dark: '\u263e' };

function applyMode(t) {
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  $('theme').textContent = GLYPH[t];
  localStorage.setItem('vs-theme', t);
  paintSwatches();
  publish();
}
applyMode(localStorage.getItem('vs-theme') || 'auto');
applyPalette(palette);
$('theme').addEventListener('click', () =>
  applyMode(MODES[(MODES.indexOf(localStorage.getItem('vs-theme') || 'auto') + 1) % 3]));
$('modality').addEventListener('change', sendModality);

$('rec').addEventListener('click', () => (recording ? stopRec() : startRec()));
$('flush').addEventListener('click', () => wsReady && ws.send(JSON.stringify({ type: 'flush' })));
$('next').addEventListener('click', () => goto(current + 1, { user: true }));
$('prev').addEventListener('click', () => goto(current - 1, { user: true }));
$('reset').addEventListener('click', () => {
  if (!wsReady || !confirm('Throw away this deck and the transcript?')) return;
  ws.send(JSON.stringify({ type: 'reset' }));
  deck = ''; current = 0; follow = true;
  transcriptEl.querySelectorAll('p').forEach(p => p.remove());
  agentEl.innerHTML = '';
  renderDeck();
});
$('export').addEventListener('click', () => {
  // Export what Slidev would render, which is the deck with the `@vs` lines
  // already out of it — a directive in a saved file is a bug in the file.
  const md = R.splitDirectives(deck).markdown;
  const blob = new Blob([md.replace(/\s*$/, '') + '\n'], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'slides.md';
  a.click();
  URL.revokeObjectURL(a.href);
});
// The app already mirrors every pass to DECK_PATH, so "open in Slidev" is just
// the command that points Slidev at it — nothing to upload, nothing to sync.
$('slidev').addEventListener('click', () => {
  const cmd = 'npx slidev ' + (deckPath || '~/.local/share/voice-slides/slides.md');
  navigator.clipboard.writeText(cmd).then(
    () => setStatus('copied: ' + cmd),
    () => setStatus(cmd));
});
document.addEventListener('keydown', e => {
  if (e.target !== document.body) return;
  if (e.code === 'Space') { e.preventDefault(); recording ? stopRec() : startRec(); }
  else if (e.key === 'ArrowRight' || e.key === 'PageDown') goto(current + 1, { user: true });
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') goto(current - 1, { user: true });
  else if (e.key === 'Home') goto(0, { user: true });
  else if (e.key === 'End') goto(slides.length - 1, { user: true });
});

connect();
</script>
</body>
</html>
