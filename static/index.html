<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>voice-slides</title>
<style>
  /* Light is the default; dark follows the OS unless the toggle overrides it,
     so the same two blocks serve `prefers-color-scheme` and the button. */
  :root {
    --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f1f3f6; --slide:#ffffff;
    --text:#16181d; --muted:#6b7280; --border:#e5e7eb;
    --accent:#6366f1; --accent-soft:#eef0fe; --danger:#dc2626; --ok:#0f9d76;
    --shadow-sm:0 1px 2px rgb(16 24 40 / 6%);
    --shadow-md:0 1px 2px rgb(16 24 40 / 6%), 0 10px 28px -14px rgb(16 24 40 / 30%);
    --shadow-lg:0 1px 3px rgb(16 24 40 / 8%), 0 18px 40px -16px rgb(16 24 40 / 35%);
    --r-sm:8px; --r-md:12px; --r-lg:16px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0d0f13; --surface:#161a20; --surface-2:#1c2128; --slide:#181c22;
      --text:#e6e8ec; --muted:#98a1af; --border:#272d36;
      --accent:#818cf8; --accent-soft:#1e2233; --danger:#f87171; --ok:#34d399;
      --shadow-sm:0 1px 2px rgb(0 0 0 / 40%);
      --shadow-md:0 1px 2px rgb(0 0 0 / 40%), 0 10px 28px -14px rgb(0 0 0 / 70%);
      --shadow-lg:0 1px 3px rgb(0 0 0 / 50%), 0 18px 40px -16px rgb(0 0 0 / 80%);
    }
  }
  :root[data-theme="dark"] {
    --bg:#0d0f13; --surface:#161a20; --surface-2:#1c2128; --slide:#181c22;
    --text:#e6e8ec; --muted:#98a1af; --border:#272d36;
    --accent:#818cf8; --accent-soft:#1e2233; --danger:#f87171; --ok:#34d399;
    --shadow-sm:0 1px 2px rgb(0 0 0 / 40%);
    --shadow-md:0 1px 2px rgb(0 0 0 / 40%), 0 10px 28px -14px rgb(0 0 0 / 70%);
    --shadow-lg:0 1px 3px rgb(0 0 0 / 50%), 0 18px 40px -16px rgb(0 0 0 / 80%);
  }

  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text);
         font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,
              "Helvetica Neue",sans-serif;
         -webkit-font-smoothing:antialiased;
         display:flex; flex-direction:column; }

  header { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap;
           padding:.55rem .9rem; background:var(--surface);
           border-bottom:1px solid var(--border); box-shadow:var(--shadow-sm);
           position:relative; z-index:2; }
  h1 { font-size:.95rem; font-weight:600; letter-spacing:-.01em; margin:0 .3rem 0 0; }
  .sub { color:var(--muted); font-size:.8rem; margin:0; flex:1; min-width:6rem; }

  button, select { font:inherit; font-size:.82rem; color:var(--text);
           background:var(--surface); border:1px solid var(--border);
           border-radius:var(--r-sm); padding:.4rem .75rem; cursor:pointer;
           box-shadow:var(--shadow-sm);
           transition:background .12s ease, border-color .12s ease,
                      box-shadow .12s ease, transform .06s ease; }
  button:hover, select:hover { background:var(--surface-2); border-color:var(--muted); }
  button:active { transform:translateY(1px); }
  button:focus-visible, select:focus-visible {
           outline:2px solid var(--accent); outline-offset:2px; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #rec { font-weight:600; }
  #rec.on { background:var(--accent); border-color:var(--accent); color:#fff;
            box-shadow:var(--shadow-md); }
  #theme { padding:.4rem .55rem; }

  #modality { padding-right:1.6rem; }
  #status { font:.75rem/1 ui-monospace,"SF Mono",Menlo,monospace; color:var(--muted);
            min-width:9rem; text-align:right; }
  #status.err { color:var(--danger); }
  #status.live { color:var(--ok); }

  main { flex:1; display:grid; grid-template-columns:minmax(260px,32%) 1fr;
         min-height:0; gap:.9rem; padding:.9rem; }
  section { min-height:0; display:flex; flex-direction:column;
            background:var(--surface); border:1px solid var(--border);
            border-radius:var(--r-lg); box-shadow:var(--shadow-md); overflow:hidden; }
  .pane-title { font:.68rem/1 ui-sans-serif,system-ui,sans-serif; font-weight:600;
                letter-spacing:.09em; text-transform:uppercase; color:var(--muted);
                padding:.75rem 1rem .5rem; display:flex; align-items:center; gap:.5rem; }

  #transcript { flex:1; overflow-y:auto; padding:0 1rem 1rem;
                font:.85rem/1.6 ui-monospace,"SF Mono",Menlo,monospace; }
  #transcript p { margin:0 0 .7rem; }
  #partial { color:var(--muted); min-height:1.4em; }
  #deck { flex:1; overflow-y:auto; padding:.2rem 1rem 40vh; }

  /* Tool chips: the loading indicator for a fetch in flight. */
  #tools { display:flex; flex-wrap:wrap; gap:.4rem; padding:0 1rem;
           margin-left:auto; justify-content:flex-end; }
  #tools:empty { display:none; }
  .chip { display:inline-flex; align-items:center; gap:.4rem; max-width:22rem;
          font:.72rem/1 ui-sans-serif,system-ui,sans-serif; text-transform:none;
          letter-spacing:0; color:var(--muted); background:var(--surface-2);
          border:1px solid var(--border); border-radius:999px;
          padding:.3rem .65rem; box-shadow:var(--shadow-sm);
          overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
          transition:opacity .3s ease; }
  .chip.done { color:var(--ok); }
  .chip.error { color:var(--danger); border-color:var(--danger); }
  .chip.fade { opacity:0; }
  .spin { width:.7rem; height:.7rem; flex:none; border-radius:50%;
          border:2px solid var(--border); border-top-color:var(--accent);
          animation:spin .7s linear infinite; }
  .chip.done .spin, .chip.error .spin { animation:none; border:none;
          width:auto; height:auto; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .slide { background:var(--slide); border:1px solid var(--border);
           border-radius:var(--r-md); padding:1.5rem 1.7rem; margin:0 auto 1rem;
           max-width:760px; aspect-ratio:16/9; overflow:auto; cursor:pointer;
           position:relative; display:flex; flex-direction:column;
           justify-content:center; box-shadow:var(--shadow-md);
           transition:box-shadow .15s ease, border-color .15s ease; }
  .slide:hover { box-shadow:var(--shadow-lg); }
  .slide.active { border-color:var(--accent); box-shadow:var(--shadow-lg),
                  0 0 0 3px var(--accent-soft); }
  .slide.mid .content { margin:auto 0; text-align:center; }
  .slide.mid ul { display:inline-block; text-align:left; }
  .slide .content { flex:1; min-height:0; overflow:auto; }
  .slide .badge { position:absolute; top:.6rem; right:.7rem;
                  font:.6rem/1 ui-monospace,Menlo,monospace; letter-spacing:.06em;
                  color:var(--muted); background:var(--surface-2);
                  border-radius:999px; padding:.22rem .5rem; }
  .slide .note { margin-top:.7rem; padding-top:.5rem; border-top:1px solid var(--border);
                 font:.72rem/1.45 ui-sans-serif,system-ui,sans-serif; color:var(--muted); }
  .slide .note p { margin:.1rem 0; }
  .slide .lang { font:.6rem ui-monospace,Menlo,monospace; color:var(--muted);
                 margin-bottom:.2rem; }
  .slide hr.slot { border:0; border-top:1px dashed var(--border); margin:.7rem 0; }
  .slide li.sub { margin-left:1rem; font-size:.92em; color:var(--muted); list-style:circle; }
  .slide h1 { font-size:1.85rem; line-height:1.15; letter-spacing:-.02em; margin:0 0 .5rem;
              font-weight:650; }
  .slide h2 { font-size:1.3rem; font-weight:600; letter-spacing:-.01em; margin:0 0 .6rem; }
  .slide h3 { font-size:1.02rem; font-weight:600; margin:.5rem 0 .3rem; }
  .slide ul { margin:.2rem 0; padding-left:1.15rem; }
  .slide li { margin:.3rem 0; }
  .slide li::marker { color:var(--accent); }
  .slide p { margin:.35rem 0; }
  .slide blockquote { margin:.5rem 0; padding:.1rem 0 .1rem .9rem;
                      border-left:3px solid var(--accent); color:var(--muted); }
  .slide code { font:.86em ui-monospace,"SF Mono",Menlo,monospace;
                background:var(--surface-2); border-radius:5px; padding:.08em .32em; }
  .slide pre { background:var(--surface-2); border:1px solid var(--border);
               border-radius:var(--r-sm); padding:.7rem .9rem; overflow-x:auto;
               font-size:.85em; }
  .slide pre code { background:none; padding:0; }
  .slide .num { position:relative; font:.65rem ui-monospace,Menlo,monospace;
                color:var(--muted); align-self:flex-end; margin-top:auto; }
  .empty { color:var(--muted); text-align:center; padding:3.5rem 1rem; }

  /* Components. The same vocabulary the Vue SFCs render in Slidev proper. */
  .vs-chart { margin:.6rem 0; padding:.85rem 1rem; border-radius:var(--r-md);
              background:var(--surface-2); box-shadow:var(--shadow-sm); text-align:left; }
  .vs-chart .cap { font-size:.78rem; color:var(--muted); margin-bottom:.45rem; }
  .vs-chart svg { width:100%; height:auto; overflow:visible; }
  .vs-chart .bar { fill:var(--accent); }
  .vs-chart .track { fill:currentColor; opacity:.09; }
  .vs-chart .axis { stroke:currentColor; opacity:.18; }
  .vs-chart .series { fill:none; stroke:var(--accent); stroke-width:2.5;
                      stroke-linejoin:round; stroke-linecap:round; }
  .vs-chart .dot { fill:var(--accent); }
  .vs-chart .lbl { font-size:12px; fill:currentColor; opacity:.7; }
  .vs-chart .val { font-size:12px; fill:currentColor; opacity:.95; }
  .vs-meme { margin:.5rem auto; text-align:center; }
  .vs-meme img { max-height:min(320px,42vh); max-width:100%; border-radius:var(--r-md);
                 box-shadow:var(--shadow-lg); }

  @media (max-width:820px) {
    main { grid-template-columns:1fr; grid-template-rows:minmax(120px,26%) 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>voice-slides</h1>
  <p class="sub">Talk. It builds the deck.</p>
  <select id="modality" title="How much licence the formatting pass has"></select>
  <span id="status">connecting…</span>
  <button id="rec">Start dictating</button>
  <button id="flush" title="Run the formatting pass now">Format now</button>
  <button id="export">Export slides.md</button>
  <button id="slidev">Open in Slidev</button>
  <button id="reset">New deck</button>
  <button id="theme" title="Light / dark / follow the system" aria-label="Theme">◐</button>
</header>
<main>
  <section id="left">
    <div class="pane-title">Transcript</div>
    <div id="transcript"><div id="partial"></div></div>
  </section>
  <section>
    <div class="pane-title">Deck<div id="tools"></div></div>
    <div id="deck"><div class="empty">Nothing yet — press <b>Start dictating</b> and say what the talk is about.</div></div>
  </section>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
const statusEl = $('status'), partialEl = $('partial'), transcriptEl = $('transcript'), deckEl = $('deck');

let ws = null, wsReady = false;
let ctx = null, node = null, src = null, stream = null, deckPath = '';
let recording = false, deck = '', pinned = -1;
const EMPTY_HTML = '<div class="empty">Nothing yet — press <b>Start dictating</b> and say what the talk is about.</div>';

// ---------------------------------------------------------------------------
// § Renderer — an APPROXIMATION of Slidev, not Slidev.
//
// The deck is authored as, exported as, and written to disk as valid Slidev
// markdown. Slidev itself renders it (`npx slidev <deck path>`, hot-reloading
// off the same file). What this pane does is show the structure while you talk:
// slide boundaries, layouts, headings, bullets, code, presenter notes. It does
// not do themes, UnoCSS, Vue components, click animations, or Shiki.
//
// Running Slidev's own dev server for this pane would be exact, but it is a
// Vite/Vue/Node process — a second daemon and ~200 MB of node_modules — which
// is the one thing the brief rules out. The file on disk is the seam: take the
// dependency when you want the real renderer, don't when you don't.
//
// XSS: every line is escaped BEFORE any markup is applied, and the only tags
// that reach the DOM are ones this file emits from a closed set. Known Slidev
// wrappers are DELETED (see WRAPPERS), never passed through. Nothing
// transcript-derived is ever interpreted as HTML, so DOMPurify has nothing to
// do — no raw markup survives escapeHtml() to need sanitizing.
// ---------------------------------------------------------------------------

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// Slidev/Vue wrappers this preview understands. They are DELETED from the
// source before escaping — never re-emitted — so this stays a pure-text path.
const WRAPPERS = /<\/?(?:v-click|v-clicks|v-after|v-switch|v-mark|div|span|p)\b[^>]*>/gi;

function inline(s) {                       // s is ALREADY escaped
  return s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1');   // link text only; no href reaches the DOM
}

// -- Slidev document parsing ------------------------------------------------
// `---` on its own line is both the slide separator and the YAML fence, so the
// two are told apart positionally: a block that opens the file, or that opens
// immediately after a separator and closes at the next `---` with nothing but
// `key: value` / indented continuation lines in between, is frontmatter.

// A continuation line inside a block that is already known to be YAML: a
// nested key, a list item, a comment.
const YAMLISH = /^(\s*[\w.$-]+\s*:|[\s-]|#)/;
// What makes a block YAML rather than prose: at least one `key: value`...
const KEYVAL = /^\s*[\w.$-]+\s*:(\s|$)/;
// ...and no heading. `# Title` followed by `- bullet` lines satisfies every
// YAMLISH test (`#` reads as a comment, `-` as a list item), so a slide of
// that shape used to be eaten as frontmatter along with the separator that
// closed it — dropping every other slide from the preview.
const HEADING = /^\s{0,3}#{1,6}\s/;

function looksLikeFrontmatter(lines, start) {
  let keyval = false;
  for (let i = start; i < lines.length; i++) {
    const l = lines[i];
    if (l.trim() === '---') return keyval;           // closed, and actually YAML
    if (!l.trim()) continue;
    if (HEADING.test(l)) return false;
    if (KEYVAL.test(l)) { keyval = true; continue; }
    if (!YAMLISH.test(l)) return false;
  }
  return false;
}

function parseYamlish(text) {
  const fm = {};
  for (const l of text.split('\n')) {
    const m = l.match(/^([\w.$-]+)\s*:\s*(.*)$/);
    if (m) fm[m[1]] = m[2].replace(/^['"]|['"]$/g, '').trim();
  }
  return fm;
}

function parseDeck(md) {
  const lines = md.replace(/\r/g, '').split('\n');
  const slides = [];
  let i = 0, fm = {}, body = [];
  if (lines[0] !== undefined && lines[0].trim() === '---' && looksLikeFrontmatter(lines, 1)) {
    let j = 1;
    while (lines[j].trim() !== '---') j++;
    fm = parseYamlish(lines.slice(1, j).join('\n'));
    i = j + 1;
  }
  const flush = () => {
    if (body.join('').trim() || Object.keys(fm).length) slides.push({ fm, body: body.join('\n') });
    fm = {}; body = [];
  };
  // A fenced code block can contain a line of three dashes; inside one, `---`
  // is content, not a separator.
  let fenced = false;
  for (; i < lines.length; i++) {
    if (/^\s*```/.test(lines[i])) fenced = !fenced;
    if (fenced || lines[i].trim() !== '---') { body.push(lines[i]); continue; }
    flush();
    if (looksLikeFrontmatter(lines, i + 1)) {
      let j = i + 1;
      while (lines[j].trim() !== '---') j++;
      fm = parseYamlish(lines.slice(i + 1, j).join('\n'));
      i = j;
    }
  }
  flush();
  return slides.filter(s => s.body.trim() || s.fm.src);
}

// Trailing HTML comment == presenter note.
function splitNote(body) {
  const m = body.match(/<!--([\s\S]*?)-->\s*$/);
  return m ? [body.slice(0, m.index), m[1].trim()] : [body, ''];
}

// -- Components -------------------------------------------------------------
// <Chart> and <Meme> are Vue SFCs when Slidev renders the deck (slidev/
// components/, mirrored beside the deck file). Here they are drawn from the
// same attributes by hand, so the preview shows the real shape of the slide
// rather than a placeholder.
//
// Attribute values are model output derived from a live microphone, so nothing
// is evaluated: chart data is scraped for [label, number] pairs by regex, the
// meme template is validated against [a-z0-9-], the image URL is BUILT here
// from a fixed host, and every label is escaped before it reaches the DOM.

const COMPONENT = /^\s*<(Chart|Meme)\b([^>]*?)\/?>\s*$/;
const ATTR = /(:?[\w-]+)\s*=\s*"([^"]*)"/g;
const PAIR = /\[\s*(?:'([^']*)'|"([^"]*)")\s*,\s*(-?\d+(?:\.\d+)?)\s*\]/g;
const MEME_HOST = 'https://api.memegen.link/images/';

function attrs(s) {
  const out = {};
  for (const m of s.matchAll(ATTR)) out[m[1].replace(/^:/, '')] = m[2];
  return out;
}

function pairs(s) {
  const out = [];
  for (const m of (s || '').matchAll(PAIR)) {
    const v = parseFloat(m[3]);
    if (Number.isFinite(v)) out.push([m[1] !== undefined ? m[1] : m[2], v]);
  }
  return out.slice(0, 12);
}

// memegen escapes captions in the URL path with its own scheme, not percent
// encoding. Mirrors seg() in slidev/components/Meme.vue.
function memeSeg(s) {
  return (String(s || '').trim() || '_')
    .replace(/_/g, '__').replace(/-/g, '--').replace(/ /g, '_')
    .replace(/\?/g, '~q').replace(/&/g, '~a').replace(/%/g, '~p')
    .replace(/#/g, '~h').replace(/\//g, '~s').replace(/\\/g, '~b')
    .replace(/</g, '~l').replace(/>/g, '~g').replace(/"/g, "''")
    .replace(/[^\w~.'-]/g, '');
}

function renderChart(a) {
  const data = pairs(a.data);
  if (!data.length) return '';
  const unit = a.unit ? ' ' + a.unit : '';
  const fmt = v => escapeHtml((Number.isInteger(v) ? v : v.toFixed(1)) + unit);
  const max = Math.max(1, ...data.map(d => d[1]));
  const cap = a.title ? `<div class="cap">${escapeHtml(a.title)}</div>` : '';
  let svg;
  if (a.type === 'line') {
    const W = 460, H = 170, P = 18;
    const pts = data.map(([l, v], i) => [
      P + (data.length < 2 ? W / 2 - P : i * (W - 2 * P) / (data.length - 1)),
      H - P - (v / max) * (H - 3 * P), l, v]);
    svg = `<svg viewBox="0 0 ${W} ${H}">` +
      `<line class="axis" x1="${P}" y1="${H - P}" x2="${W - P}" y2="${H - P}"></line>` +
      `<polyline class="series" points="${pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}"></polyline>` +
      pts.map(([x, y, l, v]) =>
        `<circle class="dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5"></circle>` +
        `<text class="val" x="${x.toFixed(1)}" y="${(y - 9).toFixed(1)}" text-anchor="middle">${fmt(v)}</text>` +
        `<text class="lbl" x="${x.toFixed(1)}" y="${H - 5}" text-anchor="middle">${escapeHtml(l)}</text>`
      ).join('') + '</svg>';
  } else {
    const BH = 30, LW = 132, TX = 140, TW = 300;
    svg = `<svg viewBox="0 0 480 ${data.length * BH}">` + data.map(([l, v], i) => {
      const w = Math.max(2, (v / max) * TW).toFixed(1);
      return `<g transform="translate(0 ${i * BH})">` +
        `<text class="lbl" x="${LW}" y="19" text-anchor="end">${escapeHtml(l)}</text>` +
        `<rect class="track" x="${TX}" y="6" width="${TW}" height="14" rx="7"></rect>` +
        `<rect class="bar" x="${TX}" y="6" width="${w}" height="14" rx="7"></rect>` +
        `<text class="val" x="${(TX + Number(w) + 8).toFixed(1)}" y="19">${fmt(v)}</text></g>`;
    }).join('') + '</svg>';
  }
  return `<figure class="vs-chart">${cap}${svg}</figure>`;
}

function renderMeme(a) {
  const slug = /^[a-z0-9-]{1,40}$/.test(a.template || '') ? a.template : 'fine';
  const src = MEME_HOST + slug + '/' + memeSeg(a.top) + '/' + memeSeg(a.bottom) + '.png';
  return `<figure class="vs-meme"><img class="meme" src="${escapeHtml(src)}" alt="meme"></figure>`;
}

function renderComponent(line) {
  const m = line.match(COMPONENT);
  if (!m) return null;
  const a = attrs(m[2]);
  return m[1] === 'Chart' ? renderChart(a) : renderMeme(a);
}

function renderBody(md) {
  const out = [];
  let list = null, fence = null, lang = '';
  const closeList = () => { if (list) { out.push('</ul>'); list = null; } };
  // A component tag with several attributes gets wrapped over two lines by
  // anything that formats markdown; fold it back to one so the line-oriented
  // loop below sees a whole tag.
  const folded = md.replace(WRAPPERS, '')
                   .replace(/<(?:Chart|Meme)\b[^>]*>/g, t => t.replace(/\s*\n\s*/g, ' '));
  for (const raw of folded.split('\n')) {
    const line = raw.replace(/\s+$/, '');
    const f = line.match(/^\s*```+\s*([\w+-]*)/);
    if (f) {
      if (fence === null) { closeList(); fence = []; lang = f[1] || ''; }
      else {
        out.push((lang ? `<div class="lang">${escapeHtml(lang)}</div>` : '') +
                 '<pre><code>' + fence.map(escapeHtml).join('\n') + '</code></pre>');
        fence = null;
      }
      continue;
    }
    if (fence !== null) { fence.push(raw); continue; }
    const comp = renderComponent(line);
    if (comp !== null) { closeList(); if (comp) out.push(comp); continue; }
    if (/^\s*::[\w-]+::\s*$/.test(line)) { closeList(); out.push('<hr class="slot">'); continue; }
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { closeList(); const n = h[1].length; out.push(`<h${n}>${inline(escapeHtml(h[2]))}</h${n}>`); continue; }
    const b = line.match(/^(\s*)[-*+]\s+(.*)$/);
    if (b) {
      if (!list) { out.push('<ul>'); list = true; }
      const deep = b[1].length >= 2 ? ' class="sub"' : '';
      out.push(`<li${deep}>${inline(escapeHtml(b[2]))}</li>`);
      continue;
    }
    const q = line.match(/^>\s?(.*)$/);
    if (q) { closeList(); out.push(`<blockquote>${inline(escapeHtml(q[1]))}</blockquote>`); continue; }
    if (!line.trim()) { closeList(); continue; }
    closeList();
    out.push(`<p>${inline(escapeHtml(line))}</p>`);
  }
  if (fence !== null) out.push('<pre><code>' + fence.map(escapeHtml).join('\n') + '</code></pre>');
  closeList();
  return out.join('');
}

const CENTERED = new Set(['cover', 'center', 'intro', 'statement', 'fact', 'quote', 'section', 'end']);

function renderDeck(md) {
  const slides = parseDeck(md);
  if (!slides.length) { deckEl.innerHTML = EMPTY_HTML; return; }
  // The dictation head is the end of the deck, so that is what the preview
  // follows — unless the user clicked a slide to pin their attention.
  const active = pinned >= 0 && pinned < slides.length ? pinned : slides.length - 1;
  deckEl.innerHTML = '';
  slides.forEach((s, i) => {
    const layout = s.fm.layout || (i === 0 ? 'cover' : 'default');
    const [body, note] = splitNote(s.body);
    const el = document.createElement('div');
    el.className = 'slide' + (i === active ? ' active' : '') + (CENTERED.has(layout) ? ' mid' : '');
    el.innerHTML =
      `<div class="badge">${escapeHtml(layout)}</div>` +
      `<div class="content">${renderBody(body)}</div>` +
      (note ? `<div class="note">${renderBody(note)}</div>` : '') +
      `<div class="num">${i + 1} / ${slides.length}</div>`;
    el.addEventListener('click', () => { pinned = (pinned === i ? -1 : i); renderDeck(deck); });
    deckEl.appendChild(el);
  });
  deckEl.children[active].scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// ---------------------------------------------------------------------------
// § Transport
// ---------------------------------------------------------------------------

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { wsReady = true; setStatus('ready'); ws.send(JSON.stringify({ type: 'hello' })); };
  ws.onclose = () => { wsReady = false; setStatus('reconnecting…', 'err'); setTimeout(connect, 1500); };
  ws.onmessage = e => onMessage(JSON.parse(e.data));
}

function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = cls || ''; }

function onMessage(m) {
  if (m.type === 'partial') { partialEl.textContent = m.text ? '… ' + m.text : ''; scrollTranscript(); }
  else if (m.type === 'final') {
    partialEl.textContent = '';
    const p = document.createElement('p');
    p.textContent = m.text;
    transcriptEl.insertBefore(p, partialEl);
    scrollTranscript();
  }
  else if (m.type === 'deck') { deck = m.markdown || ''; renderDeck(deck); setStatus(m.pass_ms ? `deck updated ${(m.pass_ms/1000).toFixed(1)}s` : 'ready'); }
  else if (m.type === 'status') { if (m.text) setStatus(m.text, m.text === 'formatting…' ? 'live' : ''); }
  else if (m.type === 'error') { setStatus(m.message, 'err'); }
  else if (m.type === 'tool') { showTool(m); }
  else if (m.type === 'config') {
    deckPath = m.deck_path;
    $('slidev').title = 'npx slidev ' + deckPath;
    fillModalities(m.modalities || [], m.modality);
  }
}

// ---------------------------------------------------------------------------
// § Modality — close dictation / highlights + sources / spicy. The list comes
// from the server so the picker and the prompts cannot drift apart.
// ---------------------------------------------------------------------------

function fillModalities(list, current) {
  const sel = $('modality');
  if (!list.length || sel.options.length === list.length) return;
  sel.innerHTML = '';
  for (const m of list) {
    const o = document.createElement('option');
    o.value = m.id;
    o.textContent = m.label;
    o.title = m.hint;
    sel.appendChild(o);
  }
  sel.value = localStorage.getItem('vs-modality') || current || list[0].id;
  sendModality();
}

function sendModality() {
  const id = $('modality').value;
  if (!id) return;
  localStorage.setItem('vs-modality', id);
  const opt = $('modality').selectedOptions[0];
  $('modality').title = (opt && opt.title) || '';
  if (wsReady) ws.send(JSON.stringify({ type: 'modality', id }));
}

// A pass in the highlights modality can spend ten seconds inside a fetch. The
// chip is what makes that legible instead of a hang.
const chips = new Map();

function showTool(m) {
  const key = m.name + '|' + m.detail;
  let chip = chips.get(key);
  if (!chip) {
    chip = document.createElement('span');
    chip.className = 'chip';
    chip.innerHTML = '<i class="spin"></i><span></span>';
    $('tools').appendChild(chip);
    chips.set(key, chip);
  }
  const label = chip.lastChild;
  if (m.state === 'running') { label.textContent = m.detail || m.name; return; }
  chip.className = 'chip ' + m.state;
  chip.firstChild.textContent = m.state === 'done' ? '✓' : '✗';
  label.textContent = (m.detail || m.name) + (m.note ? ' — ' + m.note : '');
  setTimeout(() => { chip.classList.add('fade'); }, m.state === 'done' ? 2500 : 6000);
  setTimeout(() => { chip.remove(); chips.delete(key); }, m.state === 'done' ? 3000 : 6500);
}

function scrollTranscript() { transcriptEl.scrollTop = transcriptEl.scrollHeight; }

// ---------------------------------------------------------------------------
// § Capture. Continuous dictation with energy-based endpointing: /stt/stream is
// turn-based (one authoritative final per {"type":"end"}), so something has to
// decide where an utterance ends. A short RMS gate does it without a model, a
// worklet file, or a VAD dependency.
// ---------------------------------------------------------------------------

const FRAME = 1024;              // ~64 ms at 16 kHz
const SILENCE_RMS = 0.012;       // below this counts as silence
const SILENCE_MS = 900;          // ...for this long, and the utterance ends
const MAX_TURN_MS = 25000;       // ...or this long regardless, so the deck moves

let voiced = false, lastVoice = 0, turnStart = 0;

async function startRec() {
  if (recording || !wsReady) return;
  if (!ctx) {
    // Ask for 16 kHz directly; the browser resamples, so no manual decimation.
    ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
    src = ctx.createMediaStreamSource(stream);
    node = ctx.createScriptProcessor(FRAME, 1, 1);
    node.onaudioprocess = onAudio;
    src.connect(node);
    node.connect(ctx.destination);
  }
  await ctx.resume();
  recording = true; voiced = false; turnStart = 0;
  $('rec').classList.add('on');
  $('rec').textContent = 'Stop';
  setStatus('listening…', 'live');
}

function onAudio(e) {
  if (!recording || !wsReady) return;
  const f = e.inputBuffer.getChannelData(0);
  let sum = 0;
  const pcm = new Int16Array(f.length);
  for (let i = 0; i < f.length; i++) {
    const s = Math.max(-1, Math.min(1, f[i]));
    sum += s * s;
    pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  const rms = Math.sqrt(sum / f.length);
  const now = performance.now();

  if (rms >= SILENCE_RMS) {
    if (!voiced) { voiced = true; turnStart = now; }
    lastVoice = now;
  }
  // Leading silence is not worth uploading; trailing silence is — it is what
  // gives the decoder its right-context on the last word.
  if (voiced) ws.send(pcm.buffer);

  if (voiced && (now - lastVoice > SILENCE_MS || now - turnStart > MAX_TURN_MS)) {
    ws.send(JSON.stringify({ type: 'end' }));
    voiced = false;
  }
}

function stopRec() {
  if (!recording) return;
  recording = false;
  if (voiced) { ws.send(JSON.stringify({ type: 'end' })); voiced = false; }
  $('rec').classList.remove('on');
  $('rec').textContent = 'Start dictating';
  setStatus('stopped');
}

// ---------------------------------------------------------------------------
// § Controls
// ---------------------------------------------------------------------------

// Light / dark / follow the system. `data-theme` overrides the media query;
// absent, the media query wins.
const THEMES = ['auto', 'light', 'dark'], GLYPH = { auto: '\u25d0', light: '\u2600', dark: '\u263e' };

function applyTheme(t) {
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  $('theme').textContent = GLYPH[t];
  localStorage.setItem('vs-theme', t);
}
applyTheme(localStorage.getItem('vs-theme') || 'auto');
$('theme').addEventListener('click', () => {
  const next = THEMES[(THEMES.indexOf(localStorage.getItem('vs-theme') || 'auto') + 1) % 3];
  applyTheme(next);
});
$('modality').addEventListener('change', sendModality);

$('rec').addEventListener('click', () => (recording ? stopRec() : startRec()));
$('flush').addEventListener('click', () => wsReady && ws.send(JSON.stringify({ type: 'flush' })));
$('reset').addEventListener('click', () => {
  if (!wsReady || !confirm('Throw away this deck and the transcript?')) return;
  ws.send(JSON.stringify({ type: 'reset' }));
  deck = ''; pinned = -1;
  transcriptEl.querySelectorAll('p').forEach(p => p.remove());
  renderDeck('');
});
$('export').addEventListener('click', () => {
  const blob = new Blob([deck.replace(/\s*$/, '') + '\n'], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'slides.md';
  a.click();
  URL.revokeObjectURL(a.href);
});
// The app already mirrors every pass to DECK_PATH, so "open in Slidev" is just
// the command that points Slidev at it — nothing to upload, nothing to sync.
$('slidev').addEventListener('click', () => {
  const cmd = 'npx slidev ' + (deckPath || '~/.local/share/voice-slides/slides.md');
  navigator.clipboard.writeText(cmd).then(
    () => setStatus('copied: ' + cmd),
    () => setStatus(cmd));
});
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); recording ? stopRec() : startRec(); }
});

connect();
</script>
</body>
</html>
